[project]
name = "gamevault-backend"
version = "1.0.0"
description = "GameVault API — Interactive Game Database & Community Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "meilisearch-python-sdk>=3.3.0",
    "minio>=7.2.0",
    "authlib>=1.3.0",
    "python-slugify>=8.0.0",
    "markdown>=3.7",
    "bleach>=6.2.0",
    "jinja2>=3.1.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
